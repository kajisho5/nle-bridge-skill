name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # opentimelineio and its FCP7 XML / CMX 3600 adapters: the reference reader of every file this skill writes
      - run: pip install -e ".[test]"
      - name: Unit tests, reference-reader tests included (not skipped)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ! grep -q "skipped 'needs opentimelineio" test.log
      - run: nle-bridge contract --json
      - run: nle-bridge doctor --json

  integration:
    # ffmpeg from apt and read-only checkouts of ffmpeg-skill (media facts through `probe`, and its own
    # `render --export-timeline` files read back) and Velisa (registry conformance, contract schema). No test may skip.
    # ffmpeg-skill: v3.0.0 (probe reports the media start timecode; needs Python 3.10+ and FFmpeg 6.1+, which
    # Ubuntu 24.04's apt ffmpeg is), v2.24.1 (the last 2.x: no timecode in probe, the start stays not known) and main.
    # The dependency's version_range is >=2.0.0 <4.0.0 (docs/decisions.md ADR-008).
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-skill: [v3.0.0, v2.24.1, main]
    name: integration (ffmpeg-skill ${{ matrix.ffmpeg-skill }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          ref: ${{ matrix.ffmpeg-skill }}
          path: ffmpeg-skill
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/Velisa
          path: Velisa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - run: pip install -e ".[test]" jsonschema
      - name: Integration tests run (no test may skip)
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
          VELISA_DIR: ${{ github.workspace }}/Velisa
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          if grep '\.\.\. skipped' test.log; then echo "tests were skipped"; exit 1; fi
      - name: doctor
        env:
          FFMPEG_SKILL_DIR: ${{ github.workspace }}/ffmpeg-skill
        run: nle-bridge doctor --json

  auto-editor-fixtures:
    # The committed auto-editor fixtures (roadmap step 13, docs/decisions.md ADR-009) are what auto-editor 29.3.1
    # writes: regenerate them with that release's binary (sha256 pinned) and require the same bytes. nle-bridge
    # itself never runs auto-editor; the unit jobs read the committed files.
    runs-on: ubuntu-24.04
    env:
      AUTO_EDITOR_VERSION: "29.3.1"
      AUTO_EDITOR_SHA256: ""
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - name: auto-editor ${{ env.AUTO_EDITOR_VERSION }} (release binary, sha256 checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/auto-editor" \
            "https://github.com/WyattBlue/auto-editor/releases/download/${AUTO_EDITOR_VERSION}/auto-editor-linux-x86_64"
          sha256sum "$RUNNER_TEMP/auto-editor"
          if [ -n "$AUTO_EDITOR_SHA256" ]; then echo "$AUTO_EDITOR_SHA256  $RUNNER_TEMP/auto-editor" | sha256sum -c -; fi
          chmod +x "$RUNNER_TEMP/auto-editor"
      - name: Regenerate the fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures"
          AUTO_EDITOR="$RUNNER_TEMP/auto-editor" tests/fixtures/auto-editor/make_fixtures.sh "$RUNNER_TEMP/fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-editor-fixtures
          path: ${{ runner.temp }}/fixtures
      - name: Same bytes as the committed fixtures
        run: |
          for f in "$RUNNER_TEMP"/fixtures/*; do
            cmp "$f" "tests/fixtures/auto-editor/$(basename "$f")"
          done
